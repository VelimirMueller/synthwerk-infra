# Synthwerk local stack: edge, WAF, bus, database, telemetry, pulse, Zitadel,
# identity and llm.
#
#   scripts/init-env.sh            # once: write .env with generated dev passwords
#   docker compose up --wait       # start and wait until every service is healthy
#   docker compose --profile ollama up --wait   # also start Ollama
#
# Every image is pinned by tag and digest. Renovate bumps both.
name: synthwerk

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

# Env block for every Synthwerk service (#71 conventions). Add OTEL_SERVICE_NAME per service.
x-service-env: &service-env
  SYNTHWERK_PLATFORM_ENV: ${SYNTHWERK_PLATFORM_ENV:-local}
  # OTLP over gRPC: the Go kit (synthwerk-contracts) and the blueprint conventions use it.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 20s

services:
  # Edge: Traefik v3. Rate limit, body limit, Coraza WAF (forwardAuth), routes.
  edge:
    <<: *hardening
    image: traefik:v3.7.16@sha256:6d3e069ee484ab1da5adfdda555a75eb9b1545ef09096a0cc7c3043101986a20
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    environment:
      # The OTel resource detector needs USER when Traefik runs without cgo as non-root.
      USER: traefik
      # Read by the CORS middleware template in dynamic/middlewares.yml.
      SYNTHWERK_CORS_ORIGINS: ${SYNTHWERK_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN: ${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}
    ports:
      - "127.0.0.1:${SYNTHWERK_EDGE_HTTP_PORT:-8080}:8000"
    volumes:
      - ./compose/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./compose/traefik/dynamic:/etc/traefik/dynamic:ro
    networks: [edge, app]
    depends_on:
      waf:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "traefik", "healthcheck", "--ping"]

  # WAF: Coraza + OWASP CRS v4, called by the edge for every request.
  # Built here from digest-pinned bases (waf/Dockerfile). See docs/adr/0001.
  waf:
    <<: *hardening
    build:
      context: .
      dockerfile: waf/Dockerfile
    image: synthwerk-waf:local
    read_only: true
    cap_drop: [ALL]
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: synthwerk-waf
      SYNTHWERK_WAF_ENGINE: ${SYNTHWERK_WAF_ENGINE:-On}
      SYNTHWERK_WAF_PARANOIA_LEVEL: ${SYNTHWERK_WAF_PARANOIA_LEVEL:-1}
      # Only the Zitadel host may send gRPC, gRPC-web and Connect (waf.GRPCHosts).
      SYNTHWERK_WAF_GRPC_HOSTS: ${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}
    networks: [app]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/waf", "healthcheck"]

  # Stub backend behind the edge. The WAF test sends its requests here.
  stub:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24-slim@sha256:a8cb0f33d51fa107c96fd2bd3a71aaf564ec131e9d2bdf8700944f0ed8b170d7
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - ./compose/stub/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [app]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]

  # Pulse: checks every part of this stack and streams the status over SSE
  # (GET /pulse/v1/health/stream on the edge). Targets: compose/pulse/targets.yaml.
  # Image from synthwerk-pulse main 06b20b4 (sha-06b20b4f7f08), pinned by digest.
  pulse:
    <<: *hardening
    image: ghcr.io/velimirmueller/synthwerk-pulse:sha-06b20b4f7f0895d4c0eac6613a8a2263b196ba31@sha256:2f49a6ff8d4f1a7492286c7c76729d6b47716702b38d758ef46a1ee3c5e65bcd
    read_only: true
    cap_drop: [ALL]
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: synthwerk-pulse
      SYNTHWERK_PULSE_DATABASE_URL: postgres://${SYNTHWERK_POSTGRES_USER:-synthwerk}:${SYNTHWERK_POSTGRES_PASSWORD:?run scripts/init-env.sh to write .env}@database:5432/${SYNTHWERK_POSTGRES_DB:-synthwerk}?sslmode=disable
      SYNTHWERK_PULSE_NATS_URL: nats://${SYNTHWERK_NATS_USER:-synthwerk}:${SYNTHWERK_NATS_PASSWORD:?run scripts/init-env.sh to write .env}@bus:4222
      SYNTHWERK_PULSE_TARGETS_FILE: /etc/pulse/targets.yaml
    volumes:
      - ./compose/pulse/targets.yaml:/etc/pulse/targets.yaml:ro
    networks: [app, data]
    depends_on:
      bus:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/pulse", "healthcheck"]

  # Bus: NATS with JetStream.
  bus:
    <<: *hardening
    image: nats:2.15.1-alpine@sha256:2ae57dfba3063d5e25fecb75256118c0882a1a2d2cf7d0fba17a7c701df956f6
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      SYNTHWERK_NATS_USER: ${SYNTHWERK_NATS_USER:-synthwerk}
      SYNTHWERK_NATS_PASSWORD: ${SYNTHWERK_NATS_PASSWORD:?run scripts/init-env.sh to write .env}
    volumes:
      - ./compose/nats/nats.conf:/etc/nats/nats.conf:ro
      - bus-data:/data
    networks: [data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]

  # Database: PostgreSQL 18.
  database:
    <<: *hardening
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${SYNTHWERK_POSTGRES_USER:-synthwerk}
      POSTGRES_PASSWORD: ${SYNTHWERK_POSTGRES_PASSWORD:?run scripts/init-env.sh to write .env}
      POSTGRES_DB: ${SYNTHWERK_POSTGRES_DB:-synthwerk}
    volumes:
      - database-data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]

  # One-shot: roles, schemas and the zitadel database (compose/database/init.sql).
  # docker-entrypoint-initdb.d runs only on an empty volume, so this runs on every
  # `up` instead. The script is idempotent and applies rotated passwords.
  database-init:
    <<: *hardening
    restart: "no"
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    environment:
      PGHOST: database
      PGUSER: ${SYNTHWERK_POSTGRES_USER:-synthwerk}
      PGPASSWORD: ${SYNTHWERK_POSTGRES_PASSWORD:?run scripts/init-env.sh to write .env}
      PGDATABASE: ${SYNTHWERK_POSTGRES_DB:-synthwerk}
      IDENTITY_PASSWORD: ${SYNTHWERK_IDENTITY_DB_PASSWORD:?run scripts/init-env.sh to write .env}
      LLM_PASSWORD: ${SYNTHWERK_LLM_DB_PASSWORD:?run scripts/init-env.sh to write .env}
      ZITADEL_PASSWORD: ${SYNTHWERK_ZITADEL_DB_PASSWORD:?run scripts/init-env.sh to write .env}
    # $$ = a literal $ for the shell in the container, not compose interpolation.
    entrypoint:
      - sh
      - -c
      - >-
        exec psql -X -q -v ON_ERROR_STOP=1
        -v identity_password="$$IDENTITY_PASSWORD"
        -v llm_password="$$LLM_PASSWORD"
        -v zitadel_password="$$ZITADEL_PASSWORD"
        -f /init/init.sql
    volumes:
      - ./compose/database/init.sql:/init/init.sql:ro
    networks: [data]
    depends_on:
      database:
        condition: service_healthy

  # Zitadel v4 (D-42): OIDC, API and console. Login UI v2 is zitadel-login.
  # Reached on the edge by host name: http://auth.localhost:8080 locally.
  # The first start writes the instance (issuer = external domain and port) and the
  # login-client PAT into the volume zitadel-bootstrap. A changed domain needs
  # a new instance: `docker compose down --volumes`.
  zitadel:
    <<: *hardening
    image: ghcr.io/zitadel/zitadel:v4.20.0@sha256:9ea0e9ecfdc43115da871242e40a0320f2ece864c7cd8b5d41a863a7f4902499
    # Root without capabilities: the named volume is root-owned, and the PAT file the
    # API writes there must be readable by zitadel-login (also root). cap_drop ALL and
    # no-new-privileges stay on.
    user: "0"
    read_only: true
    cap_drop: [ALL]
    # The masterkey comes from the env, so it is not in the process arguments.
    command: ["start-from-init", "--masterkeyFromEnv"]
    environment:
      ZITADEL_MASTERKEY: ${SYNTHWERK_ZITADEL_MASTERKEY:?run scripts/init-env.sh to write .env}
      ZITADEL_PORT: 8080
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_EXTERNALDOMAIN: ${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}
      ZITADEL_EXTERNALPORT: ${SYNTHWERK_ZITADEL_EXTERNAL_PORT:-${SYNTHWERK_EDGE_HTTP_PORT:-8080}}
      ZITADEL_EXTERNALSECURE: ${SYNTHWERK_ZITADEL_EXTERNAL_SECURE:-false}
      # With a DSN, Zitadel uses this role directly: database-init creates it (no superuser).
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${SYNTHWERK_ZITADEL_DB_PASSWORD:?run scripts/init-env.sh to write .env}@database:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      # Quoted: unquoted, YAML reads a timestamp and the start fails.
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ${SYNTHWERK_ZITADEL_PUBLIC_URL:-http://auth.localhost:8080}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: ${SYNTHWERK_ZITADEL_PUBLIC_URL:-http://auth.localhost:8080}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: ${SYNTHWERK_ZITADEL_PUBLIC_URL:-http://auth.localhost:8080}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: ${SYNTHWERK_ZITADEL_PUBLIC_URL:-http://auth.localhost:8080}/ui/v2/login/login?samlRequest=
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
      ZITADEL_INSTRUMENTATION_SERVICENAME: synthwerk-zitadel
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE: grpc
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_ENDPOINT: telemetry:4317
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_INSECURE: "true"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    networks: [app, data]
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      start_period: 60s
      test: ["CMD", "/app/zitadel", "ready"]

  # Zitadel Login UI v2 (Next.js), on the edge at /ui/v2/login of the auth host.
  zitadel-login:
    <<: *hardening
    image: ghcr.io/zitadel/zitadel-login:v4.20.0@sha256:f1abfdf3c5d16eda03cad3b584226207ecc640ca5c679d7c45abbbce7d1d63f0
    # Root without capabilities, to read the PAT file the API wrote (see zitadel).
    user: "0"
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      # Signs the Login UI session cookie (32+ characters).
      ZITADEL_SESSION_COOKIE_SECRET: ${SYNTHWERK_ZITADEL_LOGIN_COOKIE_SECRET:?run scripts/init-env.sh to write .env}
      # The API finds its instance by host name.
      CUSTOM_REQUEST_HEADERS: Host:${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost},X-Forwarded-Proto:${SYNTHWERK_ZITADEL_PUBLIC_SCHEME:-http}
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks: [app]
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "/app/healthcheck.mjs", "http://localhost:3000/ui/v2/login/healthy"]

  # synthwerk-identity: orgs, roles, entitlements. Own role and schema "identity".
  # Image from synthwerk-identity main 4f444a4, pinned by digest.
  identity:
    <<: *hardening
    image: ghcr.io/velimirmueller/synthwerk-identity:sha-4f444a4be47b4e1ca60978fd22d7d0d06104724f@sha256:34962d23df48d8ed92be2dc9f4c54da53a5b3714f2b8227f6446422326f67795
    read_only: true
    cap_drop: [ALL]
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: synthwerk-identity
      SYNTHWERK_IDENTITY_HTTP_ADDR: ":8080"
      SYNTHWERK_IDENTITY_DATABASE_URL: postgres://identity:${SYNTHWERK_IDENTITY_DB_PASSWORD:?run scripts/init-env.sh to write .env}@database:5432/${SYNTHWERK_POSTGRES_DB:-synthwerk}?sslmode=disable
    networks: [app, data]
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/identity", "healthcheck"]

  # synthwerk-llm: chat gateway, streams answers over SSE. Own role and schema "llm".
  # Image from synthwerk-llm main 59f4681 (healthcheck subcommand), pinned by digest.
  llm:
    <<: *hardening
    image: ghcr.io/velimirmueller/synthwerk-llm:sha-59f4681c183f78fd7594cc5d906d9d261d03a1fe@sha256:0c3b418a9f8d426eced7a8fffa061b9060dd08b2e8bc5c232038293e1ec97516
    read_only: true
    cap_drop: [ALL]
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: synthwerk-llm
      SYNTHWERK_LLM_HTTP_ADDR: ":8080"
      SYNTHWERK_LLM_DATABASE_URL: postgres://llm:${SYNTHWERK_LLM_DB_PASSWORD:?run scripts/init-env.sh to write .env}@database:5432/${SYNTHWERK_POSTGRES_DB:-synthwerk}?sslmode=disable
    networks: [app, data]
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/llm", "healthcheck"]

  # Telemetry: grafana/otel-lgtm (OTel Collector, Grafana, Loki, Tempo, Prometheus).
  # D-36: all-in-one until M3, then SigNoz. OTLP on 4317 (gRPC) and 4318 (HTTP).
  telemetry:
    <<: *hardening
    image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    ports:
      - "127.0.0.1:${SYNTHWERK_TELEMETRY_UI_PORT:-3000}:3000"
      - "127.0.0.1:${SYNTHWERK_TELEMETRY_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${SYNTHWERK_TELEMETRY_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - telemetry-data:/data
    networks: [edge, app]
    healthcheck:
      <<: *healthcheck
      start_period: 90s
      retries: 40
      # run-all.sh writes /tmp/ready when the collector and all backends answer.
      test: ["CMD", "test", "-f", "/tmp/ready"]

  # Local models. Off by default: docker compose --profile ollama up --wait
  ollama:
    <<: *hardening
    profiles: [ollama]
    image: ollama/ollama:0.40.1@sha256:69f27594d8127cb43db1edcafa5e2d3cd8f88bdbc54a2cf3ceb11b8d138a24b1
    volumes:
      - ollama-models:/root/.ollama
    # "models" has egress so `ollama pull` works. "app" lets services call it.
    networks: [app, models]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "ollama", "list"]

networks:
  # Published ports live here. Only edge and telemetry join it.
  edge: {}
  # Service to service. No egress.
  app:
    internal: true
  # Bus and database. No egress, no published ports.
  data:
    internal: true
  # Egress for model downloads (ollama profile only).
  models: {}

volumes:
  bus-data: {}
  database-data: {}
  telemetry-data: {}
  ollama-models: {}
  # Zitadel login-client PAT. Holds a secret: never copy it out of the stack.
  zitadel-bootstrap: {}
