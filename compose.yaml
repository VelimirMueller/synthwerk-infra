# Synthwerk local stack: edge, WAF, bus, database, telemetry, pulse, Zitadel,
# identity and llm; vision and studio with a profile.
#
#   scripts/init-env.sh            # once: write .env with generated dev passwords
#   docker compose up --wait       # start and wait until every service is healthy
#   docker compose --profile ollama up --wait   # also start Ollama
#   docker compose --profile vision up --build --wait   # also build and start vision
#   docker compose --profile vision --profile vision-s3 up --build --wait
#                                  # vision on the S3 emulator (set SYNTHWERK_VISION_STORAGE_BACKEND=s3)
#   docker compose --profile studio up --build --wait   # also build and start studio
#
# Every image is pinned by tag and digest. Renovate bumps both. Studio and vision have
# no published image yet: their profiles build them from source (studio/Dockerfile;
# vision from a pinned commit of synthwerk-vision).
name: synthwerk

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

# Env block for every Synthwerk service (#71 conventions). Add OTEL_SERVICE_NAME per service.
x-service-env: &service-env
  SYNTHWERK_PLATFORM_ENV: ${SYNTHWERK_PLATFORM_ENV:-local}
  # OTLP over gRPC: the Go kit (synthwerk-contracts) and the blueprint conventions use it.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 20s

services:
  # Edge: Traefik v3. Rate limit, body limit, Coraza WAF (forwardAuth), routes.
  edge:
    <<: *hardening
    image: traefik:v3.7.16@sha256:6d3e069ee484ab1da5adfdda555a75eb9b1545ef09096a0cc7c3043101986a20
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    environment:
      # The OTel resource detector needs USER when Traefik runs without cgo as non-root.
      USER: traefik
      # Read by the CORS middleware template in dynamic/middlewares.yml.
      SYNTHWERK_CORS_ORIGINS: ${SYNTHWERK_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN: ${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}
    ports:
      - "127.0.0.1:${SYNTHWERK_EDGE_HTTP_PORT:-8080}:8000"
    volumes:
      - ./compose/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./compose/traefik/dynamic:/etc/traefik/dynamic:ro
    networks: [edge, app]
    depends_on:
      waf:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "traefik", "healthcheck", "--ping"]

  # WAF: Coraza + OWASP CRS v4, called by the edge for every request.
  # Built here from digest-pinned bases (waf/Dockerfile). See docs/adr/0001.
  waf:
    <<: *hardening
    build:
      context: .
      dockerfile: waf/Dockerfile
    image: synthwerk-waf:local
    read_only: true
    cap_drop: [ALL]
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: synthwerk-waf
      SYNTHWERK_WAF_ENGINE: ${SYNTHWERK_WAF_ENGINE:-On}
      SYNTHWERK_WAF_PARANOIA_LEVEL: ${SYNTHWERK_WAF_PARANOIA_LEVEL:-1}
      # Only the Zitadel host may send gRPC, gRPC-web and Connect (waf.GRPCHosts).
      SYNTHWERK_WAF_GRPC_HOSTS: ${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}
    networks: [app]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/waf", "healthcheck"]

  # Stub backend behind the edge. The WAF test sends its requests here.
  stub:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24-slim@sha256:a8cb0f33d51fa107c96fd2bd3a71aaf564ec131e9d2bdf8700944f0ed8b170d7
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - ./compose/stub/default.conf:/etc/nginx/conf.d/default.conf:ro
      # JWKS of the stack test issuer (tests/stack/issuer.sh); empty until setup.
      - ./tests/stack/issuer:/srv/issuer:ro
    networks: [app]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]

  # Pulse: checks every part of this stack and streams the status over SSE
  # (GET /pulse/v1/health/stream on the edge). Targets: compose/pulse/targets.yaml.
  # Image from synthwerk-pulse develop 984d77e (deploy.yml, token check + metrics, synthwerk#40),
  # pinned by digest.
  pulse:
    <<: *hardening
    image: ghcr.io/velimirmueller/synthwerk-pulse:984d77e14e759566d369f31d09036b2be5066e2a@sha256:6e37c2b022310bb5860c3f96d4064eea7589918490482161616e237f448a215f
    read_only: true
    cap_drop: [ALL]
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: synthwerk-pulse
      SYNTHWERK_PULSE_DATABASE_URL: postgres://${SYNTHWERK_POSTGRES_USER:-synthwerk}:${SYNTHWERK_POSTGRES_PASSWORD:?run scripts/init-env.sh to write .env}@database:5432/${SYNTHWERK_POSTGRES_DB:-synthwerk}?sslmode=disable
      SYNTHWERK_PULSE_NATS_URL: nats://${SYNTHWERK_NATS_USER:-synthwerk}:${SYNTHWERK_NATS_PASSWORD:?run scripts/init-env.sh to write .env}@bus:4222
      SYNTHWERK_PULSE_TARGETS_FILE: /etc/pulse/targets.yaml
      # Token check on every /v1 route (synthwerk#40; images from synthwerk-pulse 984d77e on).
      # Like identity and llm: Zitadel by default; the stack test points these at its
      # own issuer (tests/stack/issuer.sh). Older images ignore them.
      SYNTHWERK_PULSE_OIDC_ISSUER: ${SYNTHWERK_PULSE_OIDC_ISSUER:-http://auth.localhost:8080}
      SYNTHWERK_PULSE_OIDC_AUDIENCE: ${SYNTHWERK_PULSE_OIDC_AUDIENCE:-synthwerk-api}
      SYNTHWERK_PULSE_JWKS_URL: ${SYNTHWERK_PULSE_JWKS_URL:-}
      # Zitadel org that grants operator. Empty = nobody is operator in pulse.
      SYNTHWERK_PULSE_PLATFORM_ORG_ID: ${SYNTHWERK_PULSE_PLATFORM_ORG_ID:-}
      # Edge rates, error share and p95 per service (traefik_service_* in Prometheus).
      SYNTHWERK_PULSE_PROMETHEUS_URL: http://telemetry:9090
    volumes:
      - ./compose/pulse/targets.yaml:/etc/pulse/targets.yaml:ro
    networks: [app, data]
    depends_on:
      bus:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/pulse", "healthcheck"]

  # Bus: NATS with JetStream.
  bus:
    <<: *hardening
    image: nats:2.15.1-alpine@sha256:2ae57dfba3063d5e25fecb75256118c0882a1a2d2cf7d0fba17a7c701df956f6
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      SYNTHWERK_NATS_USER: ${SYNTHWERK_NATS_USER:-synthwerk}
      SYNTHWERK_NATS_PASSWORD: ${SYNTHWERK_NATS_PASSWORD:?run scripts/init-env.sh to write .env}
    volumes:
      - ./compose/nats/nats.conf:/etc/nats/nats.conf:ro
      - bus-data:/data
    networks: [data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]

  # Database: PostgreSQL 18.
  database:
    <<: *hardening
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${SYNTHWERK_POSTGRES_USER:-synthwerk}
      POSTGRES_PASSWORD: ${SYNTHWERK_POSTGRES_PASSWORD:?run scripts/init-env.sh to write .env}
      POSTGRES_DB: ${SYNTHWERK_POSTGRES_DB:-synthwerk}
    volumes:
      - database-data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]

  # One-shot: roles, schemas and the zitadel database (compose/database/init.sql).
  # docker-entrypoint-initdb.d runs only on an empty volume, so this runs on every
  # `up` instead. The script is idempotent and applies rotated passwords.
  database-init:
    <<: *hardening
    restart: "no"
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    environment:
      PGHOST: database
      PGUSER: ${SYNTHWERK_POSTGRES_USER:-synthwerk}
      PGPASSWORD: ${SYNTHWERK_POSTGRES_PASSWORD:?run scripts/init-env.sh to write .env}
      PGDATABASE: ${SYNTHWERK_POSTGRES_DB:-synthwerk}
      IDENTITY_PASSWORD: ${SYNTHWERK_IDENTITY_DB_PASSWORD:?run scripts/init-env.sh to write .env}
      LLM_PASSWORD: ${SYNTHWERK_LLM_DB_PASSWORD:?run scripts/init-env.sh to write .env}
      ZITADEL_PASSWORD: ${SYNTHWERK_ZITADEL_DB_PASSWORD:?run scripts/init-env.sh to write .env}
    # $$ = a literal $ for the shell in the container, not compose interpolation.
    entrypoint:
      - sh
      - -c
      - >-
        exec psql -X -q -v ON_ERROR_STOP=1
        -v identity_password="$$IDENTITY_PASSWORD"
        -v llm_password="$$LLM_PASSWORD"
        -v zitadel_password="$$ZITADEL_PASSWORD"
        -f /init/init.sql
    volumes:
      - ./compose/database/init.sql:/init/init.sql:ro
    networks: [data]
    depends_on:
      database:
        condition: service_healthy

  # Zitadel v4 (D-42): OIDC, API and console. Login UI v2 is zitadel-login.
  # Reached on the edge by host name: http://auth.localhost:8080 locally.
  # The first start writes the instance (issuer = external domain and port) and the
  # login-client PAT into the volume zitadel-bootstrap. A changed domain needs
  # a new instance: `docker compose down --volumes`.
  zitadel:
    <<: *hardening
    image: ghcr.io/zitadel/zitadel:v4.20.0@sha256:9ea0e9ecfdc43115da871242e40a0320f2ece864c7cd8b5d41a863a7f4902499
    # Root without capabilities: the named volume is root-owned, and the PAT file the
    # API writes there must be readable by zitadel-login (also root). cap_drop ALL and
    # no-new-privileges stay on.
    user: "0"
    read_only: true
    cap_drop: [ALL]
    # The masterkey comes from the env, so it is not in the process arguments.
    command: ["start-from-init", "--masterkeyFromEnv"]
    environment:
      ZITADEL_MASTERKEY: ${SYNTHWERK_ZITADEL_MASTERKEY:?run scripts/init-env.sh to write .env}
      ZITADEL_PORT: 8080
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_EXTERNALDOMAIN: ${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}
      ZITADEL_EXTERNALPORT: ${SYNTHWERK_ZITADEL_EXTERNAL_PORT:-${SYNTHWERK_EDGE_HTTP_PORT:-8080}}
      ZITADEL_EXTERNALSECURE: ${SYNTHWERK_ZITADEL_EXTERNAL_SECURE:-false}
      # With a DSN, Zitadel uses this role directly: database-init creates it (no superuser).
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${SYNTHWERK_ZITADEL_DB_PASSWORD:?run scripts/init-env.sh to write .env}@database:5432/zitadel?sslmode=disable
      # First instance (applies only when the instance is created). The platform org is
      # "synthwerk". The first human gets a generated password, never Zitadel's default.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: synthwerk
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      # init-env.sh writes hex; the suffix meets Zitadel's default complexity policy
      # (upper, lower, digit, symbol). The first start fails without it.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${SYNTHWERK_ZITADEL_ADMIN_PASSWORD:?run scripts/init-env.sh to write .env}Aa1!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # Machine user for zitadel-bootstrap (IAM owner). Its PAT goes to the volume
      # zitadel-admin, which only zitadel and zitadel-bootstrap mount: zitadel-login
      # mounts zitadel-bootstrap and must never read an IAM owner token.
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/admin/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: synthwerk bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      # Quoted: unquoted, YAML reads a timestamp and the start fails.
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ${SYNTHWERK_ZITADEL_PUBLIC_URL:-http://auth.localhost:8080}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: ${SYNTHWERK_ZITADEL_PUBLIC_URL:-http://auth.localhost:8080}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: ${SYNTHWERK_ZITADEL_PUBLIC_URL:-http://auth.localhost:8080}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: ${SYNTHWERK_ZITADEL_PUBLIC_URL:-http://auth.localhost:8080}/ui/v2/login/login?samlRequest=
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
      ZITADEL_INSTRUMENTATION_SERVICENAME: synthwerk-zitadel
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE: grpc
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_ENDPOINT: telemetry:4317
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_INSECURE: "true"
      # Action targets (webhooks): Zitadel's default deny list blocks every private
      # range. This is that list with one hole: identity's fixed address on
      # zitadel-hooks, 172.31.250.10/32. The gateway (.1) and Zitadel's own address
      # stay denied. 172.16.0.0/12 is split around the hole. Keep the CIDRs:
      # the dialer checks resolved IPs with them (DNS rebinding).
      # "::ffff:0:0/96" from the default list is left out: in v4.20.0 it matches every
      # IPv4 address, so no IPv4 target works with it. The IPv4 CIDRs above also block
      # IPv4-mapped literals such as [::ffff:127.0.0.1] (measured 2026-10-23).
      ZITADEL_HTTPCLIENT_DENYLIST: "localhost,0.0.0.0/8,10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/13,172.24.0.0/14,172.28.0.0/15,172.30.0.0/16,172.31.0.0/17,172.31.128.0/18,172.31.192.0/19,172.31.224.0/20,172.31.240.0/21,172.31.248.0/23,172.31.250.0/29,172.31.250.8/31,172.31.250.11/32,172.31.250.12/30,172.31.250.16/28,172.31.250.32/27,172.31.250.64/26,172.31.250.128/25,172.31.251.0/24,172.31.252.0/22,192.168.0.0/16,198.18.0.0/15,::/128,::1/128,fc00::/7,fe80::/10"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
      - zitadel-admin:/zitadel/admin
    networks:
      # The alias lets services inside the stack fetch the issuer URL
      # (http://auth.localhost:8080: discovery, keys, token exchange). It matches only
      # while the external port is 8080, Zitadel's own port. Another edge port
      # (SYNTHWERK_EDGE_HTTP_PORT) gives an issuer no container can reach.
      app:
        aliases: ["${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}"]
      data: {}
      zitadel-hooks: {}
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      start_period: 60s
      test: ["CMD", "/app/zitadel", "ready"]

  # Zitadel Login UI v2 (Next.js), on the edge at /ui/v2/login of the auth host.
  zitadel-login:
    <<: *hardening
    image: ghcr.io/zitadel/zitadel-login:v4.20.0@sha256:f1abfdf3c5d16eda03cad3b584226207ecc640ca5c679d7c45abbbce7d1d63f0
    # Root without capabilities, to read the PAT file the API wrote (see zitadel).
    user: "0"
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      # Signs the Login UI session cookie (32+ characters).
      ZITADEL_SESSION_COOKIE_SECRET: ${SYNTHWERK_ZITADEL_LOGIN_COOKIE_SECRET:?run scripts/init-env.sh to write .env}
      # The API finds its instance by host name.
      CUSTOM_REQUEST_HEADERS: Host:${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost},X-Forwarded-Proto:${SYNTHWERK_ZITADEL_PUBLIC_SCHEME:-http}
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks: [app]
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "/app/healthcheck.mjs", "http://localhost:3000/ui/v2/login/healthy"]

  # One-shot: the Zitadel setup as code (zitadel/bootstrap). Demo org, project
  # synthwerk-api and roles, studio OIDC app, login/password/token policies.
  # A rerun changes nothing. It calls Zitadel directly, not through the edge:
  # the WAF allows only GET, HEAD, POST and OPTIONS.
  # Reads admin.pat and writes studio-client.json (client id and secret) in the
  # volume zitadel-admin. selftest also reads the login-client PAT.
  zitadel-bootstrap:
    build:
      context: .
      dockerfile: zitadel/Dockerfile
    image: synthwerk-zitadel-bootstrap:local
    # Root without capabilities: admin.pat and the volume are root-owned (see zitadel).
    user: "0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    environment:
      SYNTHWERK_PLATFORM_ENV: ${SYNTHWERK_PLATFORM_ENV:-local}
      SYNTHWERK_ZITADEL_URL: http://zitadel:8080
      SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN: ${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}
      # :3000 = studio with pnpm dev, :3001 = studio in this stack (profile studio).
      SYNTHWERK_ZITADEL_STUDIO_REDIRECT_URIS: ${SYNTHWERK_ZITADEL_STUDIO_REDIRECT_URIS:-http://localhost:3000/api/auth/callback,http://localhost:3001/api/auth/callback}
      SYNTHWERK_ZITADEL_STUDIO_LOGOUT_URIS: ${SYNTHWERK_ZITADEL_STUDIO_LOGOUT_URIS:-http://localhost:3000/,http://localhost:3001/}
      # Copy of studio-client.json for the studio container (owner 65532, mode 0400).
      SYNTHWERK_ZITADEL_STUDIO_SHARE_FILE: /zitadel/studio/studio-client.json
      SYNTHWERK_ZITADEL_ACCESS_TOKEN_LIFETIME: ${SYNTHWERK_ZITADEL_ACCESS_TOKEN_LIFETIME:-300s}
      # Local and ci only: empty on dev and prd, so no test user exists there.
      SYNTHWERK_ZITADEL_TEST_USER_PASSWORD: ${SYNTHWERK_ZITADEL_TEST_USER_PASSWORD:-}
      # Action target for identity (#28 task 5). Zitadel resolves the name when it
      # saves the target, so identity must be up on zitadel-hooks first.
      SYNTHWERK_ZITADEL_IDENTITY_HOOK_URL: http://identity-hooks:8081/internal/zitadel/actions
      # Server-side MFA gate (synthwerk#94, ADR-0004). On by default: the pinned identity
      # image has the gate routes. With an identity image older than #94 every sign-in fails.
      SYNTHWERK_ZITADEL_MFA_GATE: ${SYNTHWERK_ZITADEL_MFA_GATE:-true}
      # Mail (invite codes, email verification) goes to Mailpit in local and ci (D-49).
      # Dev and prd set this to empty and keep their provider (Resend) out of the bootstrap.
      SYNTHWERK_ZITADEL_SMTP_HOST: ${SYNTHWERK_ZITADEL_SMTP_HOST-mailpit:1025}
      SYNTHWERK_ZITADEL_SMTP_SENDER: ${SYNTHWERK_ZITADEL_SMTP_SENDER:-auth@synthwerk.localhost}
    # CHOWN: the signing key file belongs to identity's nonroot user (65532).
    cap_add: [CHOWN]
    volumes:
      - zitadel-admin:/zitadel/admin
      - zitadel-bootstrap:/zitadel/bootstrap:ro
      - zitadel-hooks:/zitadel/hooks
      - studio-client:/zitadel/studio
    networks: [app]
    depends_on:
      zitadel:
        condition: service_healthy
      identity:
        condition: service_healthy

  # Mailpit: catches every mail Zitadel sends in local and ci (D-49). Web UI and API
  # on http://127.0.0.1:8025 (GET /api/v1/messages). The bootstrap does not wait for
  # it: Zitadel queues mail and retries. A dev or prd override must drop this
  # service and set SYNTHWERK_ZITADEL_SMTP_HOST= (empty); mail there goes through Resend.
  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    read_only: true
    cap_drop: [ALL]
    # Mailpit keeps its message database in /tmp; the root file system stays read-only.
    tmpfs: [/tmp]
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${SYNTHWERK_MAILPIT_UI_PORT:-8025}:8025"
    # "edge" only for the published UI port; Zitadel sends on "app".
    networks: [app, edge]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  # One-shot: the ES256 key identity signs widget tokens with (synthwerk#30). Made
  # once per volume, at the first start; never in git. identity reads it at start.
  identity-widget-key:
    # Same image as zitadel-bootstrap (subcommand widget-key); the second build hits the cache.
    build:
      context: .
      dockerfile: zitadel/Dockerfile
    image: synthwerk-zitadel-bootstrap:local
    user: "0"
    read_only: true
    cap_drop: [ALL]
    # CHOWN: the key file belongs to identity's nonroot user (65532).
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    command: ["widget-key"]
    environment:
      SYNTHWERK_IDENTITY_WIDGET_SIGNING_KEY_FILE: /keys/widget-signing.key
    volumes:
      - identity-keys:/keys
    network_mode: none

  # synthwerk-identity: orgs, roles, entitlements. Own role and schema "identity".
  # Image from synthwerk-identity develop d4fb74a (deploy.yml; MFA gate, widget tokens, audit of
  # llm AI settings, synthwerk#39), pinned by digest.
  identity:
    <<: *hardening
    image: ghcr.io/velimirmueller/synthwerk-identity:d4fb74ad5b4f46a9e6f109be9ff9fd391c1dfa02@sha256:b804c4618c41215b536ba3bb905ca09e46faba837b828d25a05dc9a95466f30e
    read_only: true
    cap_drop: [ALL]
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: synthwerk-identity
      SYNTHWERK_IDENTITY_HTTP_ADDR: ":8080"
      SYNTHWERK_IDENTITY_DATABASE_URL: postgres://identity:${SYNTHWERK_IDENTITY_DB_PASSWORD:?run scripts/init-env.sh to write .env}@database:5432/${SYNTHWERK_POSTGRES_DB:-synthwerk}?sslmode=disable
      # Zitadel Action listener: its own port, reached only on zitadel-hooks.
      # The edge routes /identity/* to :8080 and never to this port.
      SYNTHWERK_IDENTITY_HOOKS_ADDR: ":8081"
      SYNTHWERK_IDENTITY_ZITADEL_SIGNING_KEY_FILE: /zitadel/hooks/identity-signing.key
      # MFA gate (synthwerk#94, ADR-0002 option C): signing keys of the two targets.
      # Read only when the image has the gate routes; zitadel-bootstrap writes them
      # when SYNTHWERK_ZITADEL_MFA_GATE=true.
      SYNTHWERK_IDENTITY_MFA_GATE_KEY_FILE: /zitadel/hooks/identity-mfa-gate.key
      SYNTHWERK_IDENTITY_TOKEN_CLAIMS_KEY_FILE: /zitadel/hooks/identity-token-claims.key
      # Org roles (synthwerk#29). Token check like llm: Zitadel by default; the stack
      # test points these at its own issuer (tests/stack/issuer.sh).
      SYNTHWERK_IDENTITY_OIDC_ISSUER: ${SYNTHWERK_IDENTITY_OIDC_ISSUER:-http://auth.localhost:8080}
      SYNTHWERK_IDENTITY_OIDC_AUDIENCE: ${SYNTHWERK_IDENTITY_OIDC_AUDIENCE:-synthwerk-api}
      SYNTHWERK_IDENTITY_JWKS_URL: ${SYNTHWERK_IDENTITY_JWKS_URL:-}
      # Zitadel org that grants operator. Empty = nobody is operator in identity.
      SYNTHWERK_IDENTITY_PLATFORM_ORG_ID: ${SYNTHWERK_IDENTITY_PLATFORM_ORG_ID:-}
      # Role changes go to the Zitadel user grant as the machine user identity-sync.
      # zitadel-bootstrap writes its PAT; identity reads it per call.
      SYNTHWERK_IDENTITY_ZITADEL_API_URL: http://zitadel:8080
      SYNTHWERK_IDENTITY_ZITADEL_HOST: ${SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}
      SYNTHWERK_IDENTITY_ZITADEL_PAT_FILE: /zitadel/hooks/identity.pat
      # org.created and member.role_changed go from the outbox to EVT_IDENTITY.
      SYNTHWERK_IDENTITY_NATS_URL: nats://${SYNTHWERK_NATS_USER:-synthwerk}:${SYNTHWERK_NATS_PASSWORD:?run scripts/init-env.sh to write .env}@bus:4222
      # Widget tokens (synthwerk#30): ES256 key from identity-widget-key, issuer = the
      # public URL of identity on the edge. Key set: GET /identity/.well-known/jwks.json.
      # Older images ignore these.
      SYNTHWERK_IDENTITY_WIDGET_SIGNING_KEY_FILE: /keys/widget-signing.key
      SYNTHWERK_IDENTITY_WIDGET_ISSUER: ${SYNTHWERK_IDENTITY_WIDGET_ISSUER:-http://localhost:${SYNTHWERK_EDGE_HTTP_PORT:-8080}/identity}
      # Own-data export (synthwerk#41): identity asks llm for its part of GET /v1/me/export.
      SYNTHWERK_IDENTITY_EXPORT_SOURCES: llm=http://llm:8080
    volumes:
      - zitadel-hooks:/zitadel/hooks:ro
      - identity-keys:/keys:ro
    networks:
      app: {}
      data: {}
      # Only this alias resolves to the zitadel-hooks address, which the deny list allows.
      # Fixed: the deny list opens exactly this address.
      zitadel-hooks:
        aliases: [identity-hooks]
        ipv4_address: 172.31.250.10
    depends_on:
      database-init:
        condition: service_completed_successfully
      identity-widget-key:
        condition: service_completed_successfully
      bus:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/identity", "healthcheck"]

  # synthwerk-llm: chat gateway, streams answers over SSE. Own role and schema "llm".
  # Image from synthwerk-llm develop 4d0d2d2 (deploy.yml; widget tokens of identity on the
  # chat routes, synthwerk#30), pinned by digest.
  llm:
    <<: *hardening
    image: ghcr.io/velimirmueller/synthwerk-llm:4d0d2d2e87399338a523d11e71f192f7cb31eae4@sha256:03990d65502fe4f6130952318d9fd4931d0e144db805da403f0006fc93384c4a
    read_only: true
    cap_drop: [ALL]
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: synthwerk-llm
      SYNTHWERK_LLM_HTTP_ADDR: ":8080"
      SYNTHWERK_LLM_DATABASE_URL: postgres://llm:${SYNTHWERK_LLM_DB_PASSWORD:?run scripts/init-env.sh to write .env}@database:5432/${SYNTHWERK_POSTGRES_DB:-synthwerk}?sslmode=disable
      # The llm service creates the stream EVT_LLM at start.
      SYNTHWERK_LLM_NATS_URL: nats://${SYNTHWERK_NATS_USER:-synthwerk}:${SYNTHWERK_NATS_PASSWORD:?run scripts/init-env.sh to write .env}@bus:4222
      # ollama (dev: start the ollama profile), openai_compat or fake (CI stack test).
      SYNTHWERK_LLM_PROVIDER: ${SYNTHWERK_LLM_PROVIDER:-ollama}
      SYNTHWERK_LLM_BASE_URL: ${SYNTHWERK_LLM_BASE_URL:-}
      SYNTHWERK_LLM_MODEL_ALIASES: default=${SYNTHWERK_LLM_DEFAULT_MODEL:-qwen3.5:4b}
      SYNTHWERK_LLM_FAKE_DELAY: ${SYNTHWERK_LLM_FAKE_DELAY:-0s}
      SYNTHWERK_LLM_PROVIDER_CONCURRENCY: ${SYNTHWERK_LLM_PROVIDER_CONCURRENCY:-1}
      # Token check. Default: Zitadel (claims and audience land with #28/#30).
      # The stack test points these at its own issuer (tests/stack/issuer.sh).
      SYNTHWERK_LLM_OIDC_ISSUER: ${SYNTHWERK_LLM_OIDC_ISSUER:-http://auth.localhost:8080}
      SYNTHWERK_LLM_OIDC_AUDIENCE: ${SYNTHWERK_LLM_OIDC_AUDIENCE:-synthwerk-api}
      SYNTHWERK_LLM_JWKS_URL: ${SYNTHWERK_LLM_JWKS_URL:-}
      # Widget tokens (synthwerk#30): the second issuer, identity's widget issuer. llm takes
      # them on the chat routes only (create, read, send), bound to synthwerk:origin; export
      # and AI settings refuse them. The key set is identity's, reached inside the network.
      SYNTHWERK_LLM_WIDGET_ISSUER: ${SYNTHWERK_LLM_WIDGET_ISSUER:-${SYNTHWERK_IDENTITY_WIDGET_ISSUER:-http://localhost:${SYNTHWERK_EDGE_HTTP_PORT:-8080}/identity}}
      SYNTHWERK_LLM_WIDGET_JWKS_URL: ${SYNTHWERK_LLM_WIDGET_JWKS_URL:-http://identity:8080/.well-known/jwks.json}
      SYNTHWERK_LLM_WIDGET_AUDIENCE: ${SYNTHWERK_LLM_WIDGET_AUDIENCE:-synthwerk-api}
      # AI settings (synthwerk#39): llm checks membership and plan limit with identity.
      SYNTHWERK_LLM_IDENTITY_URL: http://identity:8080
    networks: [app, data]
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/llm", "healthcheck"]

  # One-shot: the service token of the vision label admin (synthwerk#44). Made once per
  # volume at the first start, never in git. .token (root) holds the value; a missing copy
  # is made from it: vision.token for vision (uid 10001), studio.token for studio
  # (uid 65532), each mode 0400. Reuses the pinned database image: it only needs a shell.
  vision-admin-token:
    profiles: [vision]
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: "0"
    read_only: true
    cap_drop: [ALL]
    # CHOWN: each copy belongs to the user of the service that reads it.
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    # $$ = a literal $ for the shell in the container. Prints no value.
    entrypoint:
      - sh
      - -c
      - >-
        set -eu;
        umask 077;
        if [ ! -s /secrets/.token ]; then
        od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > /secrets/.token.new;
        mv /secrets/.token.new /secrets/.token;
        rm -f /secrets/vision.token /secrets/studio.token;
        fi;
        for pair in vision:10001 studio:65532; do
        name=$${pair%%:*}; uid=$${pair##*:};
        [ -s "/secrets/$$name.token" ] && continue;
        rm -f "/secrets/$$name.token";
        cp /secrets/.token "/secrets/$$name.token";
        chmod 0400 "/secrets/$$name.token";
        chown "$$uid" "/secrets/$$name.token";
        done
    volumes:
      - vision-admin:/secrets
    network_mode: none

  # synthwerk-vision: image classification for the widgets (synthwerk#36, #44, #76, #77).
  # Profile "vision": the default SigLIP 2 build fetches about 1.5 GB of weights, too slow
  # for every "up". synthwerk-vision publishes images only from develop, which it does
  # not have yet, so compose builds the pinned main commit below (Renovate cannot bump
  # it: change the SHA in context and COMMIT together). SYNTHWERK_VISION_SRC=../synthwerk-vision
  # builds a local checkout instead. SYNTHWERK_VISION_BACKEND=mobilenet builds the small
  # model (14 MB, ImageNet classes; CI uses it). Rebuild after a change: up --build.
  vision:
    <<: *hardening
    profiles: [vision]
    build:
      context: ${SYNTHWERK_VISION_SRC:-https://github.com/VelimirMueller/synthwerk-vision.git#5d15798bdd78b77c451e970735aee2a4f37668d7}
      args:
        BACKEND: ${SYNTHWERK_VISION_BACKEND:-siglip}
        COMMIT: 5d15798bdd78b77c451e970735aee2a4f37668d7
    image: synthwerk-vision:local
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    # The admin token comes from the file vision-admin-token wrote, so it is in no
    # compose file and in no process argument. No token file: vision does not start.
    entrypoint:
      - sh
      - -c
      - >-
        token=$$(cat /secrets/vision.token) && [ -n "$$token" ] || { echo "vision: no admin token in /secrets (run vision-admin-token)" >&2; exit 1; };
        export SYNTHWERK_VISION_ADMIN_TOKEN="$$token";
        unset token;
        exec "$$@"
      - vision
    command: [uvicorn, "synthwerk_vision.main:create_app", --factory, --host, 0.0.0.0, --port, "8000", --proxy-headers, --no-access-log]
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: synthwerk-vision
      # Widget tokens (synthwerk#76): the issuer is identity's widget issuer; the key set
      # comes from identity inside the stack. The audience is identity's default.
      SYNTHWERK_VISION_OIDC_ISSUER: ${SYNTHWERK_VISION_OIDC_ISSUER:-${SYNTHWERK_IDENTITY_WIDGET_ISSUER:-http://localhost:${SYNTHWERK_EDGE_HTTP_PORT:-8080}/identity}}
      SYNTHWERK_VISION_JWKS_URL: ${SYNTHWERK_VISION_JWKS_URL:-http://identity:8080/.well-known/jwks.json}
      SYNTHWERK_VISION_OIDC_AUDIENCE: ${SYNTHWERK_VISION_OIDC_AUDIENCE:-synthwerk-api}
      # Browser origins vision answers CORS for (JSON list). The token still binds each
      # call to the origin of its app.
      SYNTHWERK_VISION_CORS_ORIGINS: ${SYNTHWERK_VISION_CORS_ORIGINS:-["http://localhost:3000","http://localhost:4174","http://localhost:5173"]}
      # The edge takes at most 1 MiB per request (edge-body-limit), so vision takes no more.
      SYNTHWERK_VISION_MAX_UPLOAD_BYTES: "1048576"
      # Uploads (synthwerk#36, #77): local folder in the volume vision-data, or s3.
      SYNTHWERK_VISION_STORAGE_BACKEND: ${SYNTHWERK_VISION_STORAGE_BACKEND:-local}
      SYNTHWERK_VISION_UPLOAD_DIR: /data/uploads
      SYNTHWERK_VISION_DATA_DIR: /data/state
      SYNTHWERK_VISION_UPLOAD_QUOTA_BYTES: ${SYNTHWERK_VISION_UPLOAD_QUOTA_BYTES:-104857600}
      SYNTHWERK_VISION_UPLOAD_QUOTA_FILES: ${SYNTHWERK_VISION_UPLOAD_QUOTA_FILES:-1000}
      SYNTHWERK_VISION_UPLOAD_QUOTA_TOTAL_BYTES: ${SYNTHWERK_VISION_UPLOAD_QUOTA_TOTAL_BYTES:-524288000}
      # One uvicorn worker, one container.
      SYNTHWERK_VISION_UPLOAD_WRITERS: ${SYNTHWERK_VISION_UPLOAD_WRITERS:-1}
      # s3 backend only. Defaults: the emulator of profile vision-s3, which ignores the keys.
      # A real bucket (Supabase Storage) sets endpoint, region, bucket and both keys in .env.
      SYNTHWERK_VISION_S3_ENDPOINT: ${SYNTHWERK_VISION_S3_ENDPOINT:-http://objectstore:5000}
      SYNTHWERK_VISION_S3_REGION: ${SYNTHWERK_VISION_S3_REGION:-us-east-1}
      SYNTHWERK_VISION_S3_BUCKET: ${SYNTHWERK_VISION_S3_BUCKET:-vision-uploads}
      SYNTHWERK_VISION_S3_ACCESS_KEY_ID: ${SYNTHWERK_VISION_S3_ACCESS_KEY_ID:-emulator}
      SYNTHWERK_VISION_S3_SECRET_ACCESS_KEY: ${SYNTHWERK_VISION_S3_SECRET_ACCESS_KEY:-emulator}
    volumes:
      - vision-admin:/secrets:ro
      # Uploads (local backend), runtime labels and corrections.
      - vision-data:/data
      # Text embeddings of added labels. The volume starts as a copy of the cache the
      # build warmed, and stays writable on the read-only root file system.
      - vision-label-cache:/app/models/label_cache
    networks: [app]
    depends_on:
      vision-admin-token:
        condition: service_completed_successfully
      # Only with the vision-s3 profile: the bucket exists before the first upload.
      objectstore-bucket:
        condition: service_completed_successfully
        required: false
    healthcheck:
      <<: *healthcheck
      # /readyz: 200 once the model is loaded (degraded counts as up), 503 while down.
      start_period: 120s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]

  # S3 emulator for vision (profile vision-s3, with SYNTHWERK_VISION_STORAGE_BACKEND=s3):
  # Moto in server mode. Path-style bucket URLs like Supabase Storage. Data in memory only.
  objectstore:
    <<: *hardening
    profiles: [vision-s3]
    image: motoserver/moto:5.2.4@sha256:120b1589c6df7e35d2092935f6ff724486bb2c4189d0e36ce795baba1400ffd2
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    networks: [app]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/', timeout=2)"]

  # One-shot: the upload bucket on the emulator. Moto takes an unsigned PUT; a rerun keeps it.
  objectstore-bucket:
    profiles: [vision-s3]
    image: motoserver/moto:5.2.4@sha256:120b1589c6df7e35d2092935f6ff724486bb2c4189d0e36ce795baba1400ffd2
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    entrypoint:
      - python
      - -c
      - |
        import urllib.error, urllib.request as r
        try:
            r.urlopen(r.Request('http://objectstore:5000/${SYNTHWERK_VISION_S3_BUCKET:-vision-uploads}', method='PUT'), timeout=10)
        except urllib.error.HTTPError as err:
            if err.code != 409:  # 409: the bucket exists already
                raise
    networks: [app]
    depends_on:
      objectstore:
        condition: service_healthy

  # synthwerk-studio (Nuxt BFF): sign-in, health view, apps, users, audit and labels
  # (synthwerk#37, #38, #40, #44, #95). Profile "studio": synthwerk-studio publishes no image
  # yet, so compose builds a checkout (SYNTHWERK_STUDIO_SRC, default ../synthwerk-studio).
  # Open http://localhost:3001 (SYNTHWERK_STUDIO_PORT); Grafana keeps :3000.
  # Sign-in needs the default edge port 8080: the server calls the issuer URL
  # (see the alias on zitadel).
  studio:
    <<: *hardening
    profiles: [studio]
    build:
      context: ./studio
      additional_contexts:
        src: ${SYNTHWERK_STUDIO_SRC:-../synthwerk-studio}
    image: synthwerk-studio:local
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      # Client id, secret and project id come from the bootstrap file (studio/start.mjs).
      STUDIO_CLIENT_FILE: /studio/studio-client.json
      NUXT_OIDC_ISSUER: ${SYNTHWERK_ZITADEL_PUBLIC_URL:-http://auth.localhost:8080}
      NUXT_OIDC_REDIRECT_URI: http://localhost:${SYNTHWERK_STUDIO_PORT:-3001}/api/auth/callback
      NUXT_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:${SYNTHWERK_STUDIO_PORT:-3001}/
      # Same switch as the server-side gate: studio refuses tokens without mfa only
      # when Zitadel puts amr into them (synthwerk#94).
      NUXT_OIDC_REQUIRE_MFA: ${SYNTHWERK_ZITADEL_MFA_GATE:-true}
      # Not required here: a stale .env must not break "up" without the profile. Empty =
      # studio answers 500 (NUXT_SESSION_SECRET must be set) and stays unhealthy;
      # scripts/init-env.sh appends a generated value.
      NUXT_SESSION_SECRET: ${SYNTHWERK_STUDIO_SESSION_SECRET:-}
      # Server side, inside the stack: identity and pulse directly, not through the edge.
      NUXT_IDENTITY_URL: http://identity:8080
      NUXT_PULSE_BASE_URL: http://pulse:8080
      # AI settings page (synthwerk#39).
      NUXT_LLM_URL: http://llm:8080
      # The embed snippet: where the widget script is served (synthwerk-widgets dev
      # server by default) and the edge the widget calls.
      NUXT_PUBLIC_WIDGET_SCRIPT_URL: ${SYNTHWERK_STUDIO_WIDGET_SCRIPT_URL:-http://localhost:4174/dist/synthwerk-chat.js}
      NUXT_PUBLIC_WIDGET_API_URL: http://localhost:${SYNTHWERK_EDGE_HTTP_PORT:-8080}
      # Label admin (synthwerk#44): vision inside the stack and its service token, read by
      # studio/start.mjs from the file vision-admin-token wrote. Without the vision profile
      # the file is missing and /api/labels answers 503.
      NUXT_VISION_URL: http://vision:8000
      VISION_ADMIN_TOKEN_FILE: /vision/studio.token
    volumes:
      - studio-client:/studio:ro
      - vision-admin:/vision:ro
    ports:
      - "127.0.0.1:${SYNTHWERK_STUDIO_PORT:-3001}:3000"
    # "edge" for the published port; "app" for Zitadel, identity and pulse.
    networks: [edge, app]
    depends_on:
      zitadel-bootstrap:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      pulse:
        condition: service_healthy
      # Only with the vision profile: the token file must exist before studio reads it.
      vision-admin-token:
        condition: service_completed_successfully
        required: false
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "/app/start.mjs", "healthcheck"]

  # Telemetry: grafana/otel-lgtm (OTel Collector, Grafana, Loki, Tempo, Prometheus).
  # D-36: all-in-one until M3, then SigNoz. OTLP on 4317 (gRPC) and 4318 (HTTP).
  telemetry:
    <<: *hardening
    image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    ports:
      - "127.0.0.1:${SYNTHWERK_TELEMETRY_UI_PORT:-3000}:3000"
      - "127.0.0.1:${SYNTHWERK_TELEMETRY_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${SYNTHWERK_TELEMETRY_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      # The collector also loads the overlay: client IPs in spans are truncated (#3).
      OTELCOL_EXTRA_ARGS: --config=file:/otel-lgtm/otelcol-client-ip.yaml
    volumes:
      - telemetry-data:/data
      - ./compose/telemetry/otelcol-client-ip.yaml:/otel-lgtm/otelcol-client-ip.yaml:ro
    networks: [edge, app]
    healthcheck:
      <<: *healthcheck
      start_period: 90s
      retries: 40
      # run-all.sh writes /tmp/ready when the collector and all backends answer.
      test: ["CMD", "test", "-f", "/tmp/ready"]

  # Local models. Off by default: docker compose --profile ollama up --wait
  ollama:
    <<: *hardening
    profiles: [ollama]
    image: ollama/ollama:0.40.1@sha256:69f27594d8127cb43db1edcafa5e2d3cd8f88bdbc54a2cf3ceb11b8d138a24b1
    volumes:
      - ollama-models:/root/.ollama
    # "models" has egress so `ollama pull` works. "app" lets services call it.
    networks: [app, models]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "ollama", "list"]

  # Pulls the model of the alias "default" once (ollama profile). Ollama downloads it
  # over the "models" network; this client only calls the API.
  ollama-pull:
    profiles: [ollama]
    image: ollama/ollama:0.40.1@sha256:69f27594d8127cb43db1edcafa5e2d3cd8f88bdbc54a2cf3ceb11b8d138a24b1
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${SYNTHWERK_LLM_DEFAULT_MODEL:-qwen3.5:4b}"]
    networks: [app]
    depends_on:
      ollama:
        condition: service_healthy

networks:
  # Published ports live here. Only edge and telemetry join it.
  edge: {}
  # Service to service. No egress.
  app:
    internal: true
  # Bus and database. No egress, no published ports.
  data:
    internal: true
  # Zitadel Action webhooks: Zitadel calls identity here, and nothing else.
  # Fixed subnet: identity has 172.31.250.10, the one address ZITADEL_HTTPCLIENT_DENYLIST leaves open.
  zitadel-hooks:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/28
  # Egress for model downloads (ollama profile only).
  models: {}

volumes:
  bus-data: {}
  database-data: {}
  telemetry-data: {}
  ollama-models: {}
  # Zitadel login-client PAT. Holds a secret: never copy it out of the stack.
  zitadel-bootstrap: {}
  zitadel-admin: {}
  # Signing key of the identity Action target and the identity-sync PAT (synthwerk#29).
  # zitadel-bootstrap writes, identity reads.
  zitadel-hooks: {}
  # Widget token signing key (synthwerk#30). identity-widget-key writes, identity reads.
  identity-keys: {}
  # Studio OIDC client (id and secret). zitadel-bootstrap writes, studio reads.
