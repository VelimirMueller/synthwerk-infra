# NATS with JetStream for the local stack.
# Credentials come from SYNTHWERK_NATS_USER, SYNTHWERK_NATS_PASSWORD,
# SYNTHWERK_NATS_STUDIO_PASSWORD and SYNTHWERK_NATS_IDENTITY_PASSWORD.
server_name: synthwerk-bus
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 2GB
}

# Three users, least privilege for studio and identity (synthwerk#106):
# - The shared service user (llm, pulse, bus-init) has every right.
# - studio only publishes its facts to evt.studio.> and reads the publish acks on its own
#   inbox prefix _INBOX_studio. It cannot create or change EVT_STUDIO: bus-init creates it.
# - identity publishes its facts to evt.identity.> and owns its stream EVT_IDENTITY. On EVT_LLM
#   and EVT_STUDIO it may only create, read and pull its own durable consumer and ack its
#   messages. Its replies come on _INBOX_identity.
# A publish or subscribe outside these lists is refused.
authorization {
  users: [
    { user: $SYNTHWERK_NATS_USER, password: $SYNTHWERK_NATS_PASSWORD }
    {
      user: studio
      password: $SYNTHWERK_NATS_STUDIO_PASSWORD
      permissions: {
        publish: { allow: ["evt.studio.>"] }
        subscribe: { allow: ["_INBOX_studio.>"] }
      }
    }
    {
      user: identity
      password: $SYNTHWERK_NATS_IDENTITY_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.identity.>",
            "$JS.API.STREAM.INFO.EVT_IDENTITY",
            "$JS.API.STREAM.CREATE.EVT_IDENTITY",
            "$JS.API.STREAM.UPDATE.EVT_IDENTITY",
            "$JS.API.CONSUMER.CREATE.EVT_LLM.identity-llm-ai-settings",
            "$JS.API.CONSUMER.CREATE.EVT_LLM.identity-llm-ai-settings.>",
            "$JS.API.CONSUMER.INFO.EVT_LLM.identity-llm-ai-settings",
            "$JS.API.CONSUMER.MSG.NEXT.EVT_LLM.identity-llm-ai-settings",
            "$JS.ACK.EVT_LLM.identity-llm-ai-settings.>",
            "$JS.API.CONSUMER.CREATE.EVT_STUDIO.identity-studio-pages",
            "$JS.API.CONSUMER.CREATE.EVT_STUDIO.identity-studio-pages.>",
            "$JS.API.CONSUMER.INFO.EVT_STUDIO.identity-studio-pages",
            "$JS.API.CONSUMER.MSG.NEXT.EVT_STUDIO.identity-studio-pages",
            "$JS.ACK.EVT_STUDIO.identity-studio-pages.>"
          ]
        }
        subscribe: { allow: ["_INBOX_identity.>"] }
      }
    }
  ]
}
