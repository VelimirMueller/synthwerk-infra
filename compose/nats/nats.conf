# NATS with JetStream for the local stack.
# Credentials come from SYNTHWERK_NATS_USER and SYNTHWERK_NATS_PASSWORD.
server_name: synthwerk-bus
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 2GB
}

# Two users. The shared service user (identity, llm, pulse) has every right.
# studio (synthwerk#106) only publishes its own facts and creates, reads and updates
# its stream EVT_STUDIO; replies come on _INBOX. A publish to another subject is refused.
authorization {
  users: [
    { user: $SYNTHWERK_NATS_USER, password: $SYNTHWERK_NATS_PASSWORD }
    {
      user: studio
      password: $SYNTHWERK_NATS_STUDIO_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.studio.>",
            "$JS.API.STREAM.INFO.EVT_STUDIO",
            "$JS.API.STREAM.CREATE.EVT_STUDIO",
            "$JS.API.STREAM.UPDATE.EVT_STUDIO"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
  ]
}
