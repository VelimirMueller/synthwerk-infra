# NATS with JetStream for the local stack.
# Credentials come from SYNTHWERK_NATS_USER and SYNTHWERK_NATS_PASSWORD.
server_name: synthwerk-bus
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 2GB
}

authorization {
  user: $SYNTHWERK_NATS_USER
  password: $SYNTHWERK_NATS_PASSWORD
}
