# Edge middlewares. Every public router uses the chain "edge-secure".
http:
  middlewares:
    edge-secure:
      chain:
        middlewares: [edge-ratelimit, edge-body-limit, edge-waf, edge-headers]

    # Same chain without edge-body-limit, for streaming responses (SSE).
    # The buffering middleware holds a response until it ends.
    edge-secure-stream:
      chain:
        middlewares: [edge-ratelimit, edge-waf, edge-headers]

    # Per client IP: 50 requests per second on average, bursts up to 100.
    edge-ratelimit:
      rateLimit:
        average: 50
        period: 1s
        burst: 100

    # Requests larger than 1 MiB get 413 before the WAF reads them. No response
    # size limit, but the response is held until it ends: streams use the stream chain.
    edge-body-limit:
      buffering:
        maxRequestBodyBytes: 1048576

    # Coraza + OWASP CRS v4 (service "waf"). A block returns 403.
    # The WAF fails closed: if it does not answer, Traefik returns 500.
    edge-waf:
      forwardAuth:
        address: http://waf:8080/check
        trustForwardHeader: false
        preserveRequestMethod: true
        forwardBody: true
        maxBodySize: 1048576
        # Caps the WAF's own answer to Traefik, not the backend response.
        maxResponseBodySize: 4096

    # CORS for the browser APIs (/identity, /llm). Origins from SYNTHWERK_CORS_ORIGINS
    # (comma list, set on the edge container), read by the file provider template
    # (see the templating note in routes.yml).
    # Put it first on a router: Traefik answers a preflight here, before the WAF.
    # No credentials: the APIs take a bearer token, not cookies.
    edge-cors:
      headers:
        accessControlAllowOriginList:
{{- range $origin := splitList "," (env "SYNTHWERK_CORS_ORIGINS") }}
          - {{ trim $origin | quote }}
{{- end }}
        accessControlAllowMethods: [GET, POST, PATCH, OPTIONS]
        accessControlAllowHeaders: [Authorization, Content-Type]
        accessControlAllowCredentials: false
        accessControlMaxAge: 600
        addVaryHeader: true

    edge-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
