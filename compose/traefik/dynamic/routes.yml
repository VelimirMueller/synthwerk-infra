# Routes. Each service is reached under /<service> on the edge, prefix stripped.
http:
  routers:
    stub:
      rule: PathPrefix(`/stub`)
      entryPoints: [web]
      middlewares: [edge-secure, strip-service-prefix]
      service: stub

    # Pulse serves GET only, and /v1/health/stream is a long-lived SSE response.
    # The chain has no "buffering" middleware: it would hold the stream back. The WAF
    # still limits a request body to 1 MiB (forwardAuth maxBodySize).
    pulse:
      rule: PathPrefix(`/pulse`)
      entryPoints: [web]
      middlewares: [edge-secure-stream, strip-service-prefix]
      service: pulse

    # identity: JSON API for the browser. CORS first, then the normal chain.
    # /identity/internal/* stays inside the stack (llm asks it which origins have an app):
    # no router matches it, so the edge answers 404.
    identity:
      rule: PathPrefix(`/identity/`) && !PathPrefix(`/identity/internal/`)
      entryPoints: [web]
      middlewares: [edge-cors, edge-secure, strip-service-prefix]
      service: identity

    # identity widget routes (synthwerk#30, #38): the chat widget calls them from
    # customer sites. identity answers CORS per app from its origin allow-list, so
    # edge-cors (SYNTHWERK_CORS_ORIGINS only) must not answer the preflight here.
    # The WAF, rate limit and body limit stay. The longer rule wins over "identity".
    identity-widget:
      rule: PathRegexp(`^/identity/v1/apps/[^/]+/widget-(settings|tokens)$`)
      entryPoints: [web]
      middlewares: [edge-secure, strip-service-prefix]
      service: identity

    # llm: the chat answer is a long-lived SSE response, so the chain is the
    # stream chain (no "buffering"), like pulse. The WAF still checks every request.
    llm:
      rule: PathPrefix(`/llm/`)
      entryPoints: [web]
      middlewares: [edge-cors, edge-secure-stream, strip-service-prefix]
      service: llm

    # llm widget chat routes (create, read, send): the chat widget calls them from
    # customer sites with a widget token. llm answers CORS itself: an origin of an app
    # (asked from identity, cached) or SYNTHWERK_LLM_CORS_ORIGINS; every other origin
    # gets no CORS headers. So edge-cors stays off, like on the identity widget routes.
    # The longer rule wins over "llm".
    llm-widget:
      rule: PathRegexp(`^/llm/v1/conversations(/[^/]+(/messages)?)?$`)
      entryPoints: [web]
      middlewares: [edge-secure-stream, strip-service-prefix]
      service: llm

    # vision (profile vision): only the widget routes and the health checks. The widget
    # sends a widget token bound to its origin (synthwerk#76); vision answers CORS from
    # SYNTHWERK_VISION_CORS_ORIGINS, so edge-cors stays off. The label admin routes take
    # the service token of the studio server: they stay inside the stack, and the edge
    # answers 404 for them. Without the profile these routes answer 502.
    vision:
      rule: PathRegexp(`^/vision/(v1/(classifications|images)|healthz|readyz)$`)
      entryPoints: [web]
      middlewares: [edge-secure, strip-service-prefix]
      service: vision

    # mascot (synthwerk#48): the public helper, no sign-in. Only the answer route and the
    # health checks. The mascot answers CORS itself from SYNTHWERK_MASCOT_CORS_ORIGINS (the
    # public site), so edge-cors stays off. WAF, rate limit and body limit stay on; the
    # mascot adds its own limit per client (6 a minute) from X-Forwarded-For, which the
    # edge sets to the client address (incoming X-Forwarded-* headers are not trusted).
    mascot:
      rule: PathRegexp(`^/mascot/(v1/answers|healthz|readyz)$`)
      entryPoints: [web]
      middlewares: [edge-secure, strip-service-prefix]
      service: mascot

    # Zitadel on its own host (D-42). The rule is a template: the host comes from
    # SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN on the edge container.
    # Templating: the Traefik file provider renders Go templates (with Sprig) in
    # every dynamic configuration file. The name needs no .tmpl suffix; the docs say
    # only "Go Templating only works with dedicated dynamic configuration files".
    # Proof on traefik v3.7.16: tests/stack/stack_test.sh gets 200 from the
    # Zitadel login UI and OIDC discovery through these Host rules, and the CORS
    # preflight returns the origin from SYNTHWERK_CORS_ORIGINS (middlewares.yml).
    # "/" goes to the login UI, /ui/v2/login* to the login UI, everything else to the
    # API (OIDC, gRPC, Connect, console) over h2c. Same split as the Zitadel compose.
    zitadel-root:
      rule: Host(`{{ env "SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN" }}`) && Path(`/`)
      entryPoints: [web]
      priority: 400
      middlewares: [edge-secure, zitadel-root-to-login]
      service: zitadel-login

    zitadel-login:
      rule: Host(`{{ env "SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN" }}`) && PathPrefix(`/ui/v2/login`)
      entryPoints: [web]
      priority: 300
      middlewares: [edge-secure]
      service: zitadel-login

    # Stream chain: gRPC server streams must not be held by "buffering". The WAF
    # still limits a request body to 1 MiB (forwardAuth maxBodySize).
    zitadel:
      rule: Host(`{{ env "SYNTHWERK_ZITADEL_EXTERNAL_DOMAIN" }}`)
      entryPoints: [web]
      priority: 200
      middlewares: [edge-secure-stream]
      service: zitadel

  middlewares:
    zitadel-root-to-login:
      replacePath:
        path: /ui/v2/login/

    strip-service-prefix:
      stripPrefixRegex:
        regex: ["^/[a-z0-9-]+"]

  services:
    # Stub backend for the WAF test until real services exist.
    stub:
      loadBalancer:
        servers:
          - url: http://stub:8080

    pulse:
      loadBalancer:
        servers:
          - url: http://pulse:8080

    identity:
      loadBalancer:
        servers:
          - url: http://identity:8080

    llm:
      loadBalancer:
        servers:
          - url: http://llm:8080

    vision:
      loadBalancer:
        servers:
          - url: http://vision:8000

    # Reached over the network "mascot" only (edge and mascot, no gateway).
    mascot:
      loadBalancer:
        servers:
          - url: http://mascot:8000

    # The Zitadel API speaks gRPC and HTTP/1.1 on one port without TLS: h2c.
    zitadel:
      loadBalancer:
        servers:
          - url: h2c://zitadel:8080

    zitadel-login:
      loadBalancer:
        servers:
          - url: http://zitadel-login:3000
