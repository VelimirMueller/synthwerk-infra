# Price table of the AI cost per day in pulse (SYNTHWERK_PULSE_AI_PRICES_FILE, synthwerk#57).
# Format: synthwerk-pulse docs/features/alerts-and-cost.md (max 256 prices, 0 to 10,000 per
# million tokens). The provider is the llm provider name of llm.message.completed.v1; model is
# the model alias, "*" = every alias.
#
# The local stack runs only local models: ollama and the fake provider (stack test, e2e) cost 0.
# openai_compat has no price here: its endpoint can be a local server or a paid API. Its
# answers count as unpriced_answers. Dev and prd mount their own table with the real prices.
currency: USD
prices:
  - provider: ollama
    model: "*"
    input_per_million: 0
    output_per_million: 0
  - provider: fake
    model: "*"
    input_per_million: 0
    output_per_million: 0
