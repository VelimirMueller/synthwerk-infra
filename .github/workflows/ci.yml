# Fleet standard ci.yml (fleet-standard templates/deploys/public) for the Go WAF and the zitadel
# bootstrap, plus the stack job: shellcheck, the whole compose stack on one runner, the edge tests.
# The stack job is an exception (fleet.yml WF-NAME-02): no fleet stage starts a compose stack.
# Required check for the ruleset: "conclusion".
# No push trigger (CI-COST-05): the main ruleset requires "conclusion", so a change reaches main
# through a PR run of this workflow.
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the e2e stage
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      # Only negated patterns, so predicate-quantifier must be `every`: paths-filter applies it per
      # file. A file is code when it matches every pattern (it is not docs); code=true when any
      # changed file is code. A .go-only PR gives code=true, a README-only PR gives code=false.
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  # gofmt, go vet, golangci-lint (.golangci.yml), actionlint, zizmor.
  lint:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-lint.yml@v0.0.2
    with:
      stack: go

  # The tests live in tests/, so the coverage counts the waf and zitadel packages (-coverpkg).
  # cmd/ holds only the main functions. Floor 70: the tests cover 70.8 % today; CI-UNIT-03 wants 80.
  unit:
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-unit.yml@v0.0.2
    with:
      stack: go
      command: go test -race -covermode=atomic -coverpkg=./waf/...,./zitadel/... -coverprofile=coverage/cover.out ./...
      coverage-floor: 70

  # The stack test as JUnit (tests/stack/e2e.sh). The stack job runs the same test on every PR.
  # e2e runs on dispatch and in promote.yml before stg (CI-E2E-01); a PR runs the same suite
  # in the extra job below. build needs e2e only so a dispatched e2e failure stops the build.
  e2e:
    needs: [changes, unit]
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.e2e }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-e2e.yml@v0.0.2
    with:
      stack: go
      command: tests/stack/e2e.sh

  build:
    needs: [changes, e2e]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-build.yml@v0.0.2
    with:
      stack: go

  # Every service of the compose stack must turn healthy; then the edge tests run.
  # The profiles vision, vision-s3 and studio are on: vision from its published image (SigLIP 2),
  # uploads on the S3 emulator with a file quota of 3, studio built from a pinned commit.
  stack:
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_PROFILES: vision,vision-s3,studio
      SYNTHWERK_VISION_STORAGE_BACKEND: s3
      SYNTHWERK_VISION_UPLOAD_QUOTA_FILES: "3"
      SYNTHWERK_STUDIO_SRC: ./.studio-src
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # synthwerk-studio main 1ec1f14 (page builder, synthwerk#46). Bump the SHA by hand.
      - name: Check out synthwerk-studio for the studio profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VelimirMueller/synthwerk-studio
          ref: 1ec1f144de6e852eb4342aed60322b13710663ac
          path: .studio-src
          persist-credentials: false
      - name: Check the shell scripts with bash and shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
          git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=warning
      - name: Validate the compose files
        run: |
          scripts/init-env.sh
          tests/stack/issuer.sh setup
          docker compose config --quiet
          docker compose --profile ollama config --quiet
          docker compose --profile studio config --quiet
          docker compose --profile vision --profile vision-s3 config --quiet
      - name: Run the stack test against the whole compose stack
        run: tests/stack/e2e.sh

  # The one required check. `skipped` passes only for e2e (dispatch only) and for a docs-only run
  # (code=false). With code=true every listed stage must be `success`; a skipped one fails here.
  conclusion:
    needs: [changes, lint, unit, e2e, build, stack]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or a required stage was skipped
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          STACK: ${{ needs.stack.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done
          if [ "$CODE" = "true" ]; then
            for r in "$LINT" "$UNIT" "$BUILD" "$STACK"; do
              [ "$r" = "success" ] || { echo "::error::a required stage did not run"; exit 1; }
            done
          fi
